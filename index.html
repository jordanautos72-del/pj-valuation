<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PJ Motor Trade - Market Valuation</title>
    <style>
        :root {
            --primary: #0284C7;
            --bg: #F1F5F9;
            --card-bg: #FFFFFF;
            --text: #0F172A;
            --border: #CBD5E1;
        }
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 12px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            margin-bottom: 16px;
        }
        h2 { margin-top: 0; font-size: 1.25rem; color: #1E293B; }
        .form-group {
            margin-bottom: 12px;
        }
        label {
            display: block;
            font-weight: 600;
            font-size: 0.85rem;
            color: #475569;
            margin-bottom: 4px;
        }
        select, button {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            background: #fff;
            box-sizing: border-box;
        }
        button.btn-search {
            background-color: var(--primary);
            color: white;
            font-weight: bold;
            border: none;
            cursor: pointer;
            margin-top: 8px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            margin-bottom: 16px;
        }
        .stat-box {
            background: #F8FAFC;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            text-align: center;
        }
        .stat-title { font-size: 0.75rem; font-weight: bold; color: #64748B; }
        .stat-val { font-size: 1.4rem; font-weight: bold; color: #0F172A; margin: 4px 0; }
        .listing-item {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .listing-info { flex-grow: 1; padding-right: 8px; }
        .listing-title { font-size: 0.9rem; font-weight: 600; color: #1E293B; margin-bottom: 2px; }
        .listing-meta { font-size: 0.75rem; color: #64748B; }
        .listing-price { font-size: 1rem; font-weight: bold; color: #0284C7; white-space: nowrap; }
        .btn-view {
            display: inline-block;
            background: #0EA5E9;
            color: white;
            text-decoration: none;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: bold;
            margin-top: 4px;
        }
        #status { font-style: italic; font-size: 0.85rem; color: #64748B; text-align: center; margin: 10px 0; }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <h2>Irish Market Valuation</h2>
        <div class="form-group">
            <label>Make</label>
            <select id="makeSelect" onchange="updateModels()">
                <option value="Nissan">Nissan</option>
                <option value="Volkswagen">Volkswagen</option>
                <option value="Ford">Ford</option>
                <option value="Peugeot">Peugeot</option>
            </select>
        </div>
        <div class="form-group">
            <label>Model</label>
            <select id="modelSelect"></select>
        </div>
        <div class="form-group">
            <label>Year</label>
            <select id="yearSelect"></select>
        </div>
        <button class="btn-search" onclick="fetchMarket()">Check Live Market</button>
    </div>

    <div class="stats-grid">
        <div class="stat-box" style="border-color: #BBF7D0; background: #F0FDF4;">
            <div class="stat-title" style="color: #15803D;">RETAIL GUIDE (MINT)</div>
            <div class="stat-val" id="valHigh">€0</div>
        </div>
        <div class="stat-box" style="border-color: #BFDBFE; background: #EFF6FF;">
            <div class="stat-title" style="color: #1D4ED8;">MARKET AVERAGE</div>
            <div class="stat-val" id="valAvg">€0</div>
        </div>
        <div class="stat-box" style="border-color: #FEF08A; background: #FEFCE8;">
            <div class="stat-title" style="color: #B45309;">TRADE / PROJECT TARGET</div>
            <div class="stat-val" id="valLow">€0</div>
        </div>
    </div>

    <div id="status">Select make, model, and year above to search.</div>
    <div id="listingsContainer"></div>
</div>

<script>
    const models = {
        "Nissan": ["Qashqai", "Juke", "Micra", "X-Trail", "Note"],
        "Volkswagen": ["Golf", "Passat", "Polo", "Tiguan", "Caddy"],
        "Ford": ["Focus", "Fiesta", "Mondeo", "Kuga", "Transit Connect"],
        "Peugeot": ["208", "308", "2008", "3008", "5008", "508"]
    };

    function updateModels() {
        const make = document.getElementById("makeSelect").value;
        const modelSelect = document.getElementById("modelSelect");
        modelSelect.innerHTML = "";
        models[make].forEach(m => {
            let opt = document.createElement("option");
            opt.value = m;
            opt.textContent = m;
            modelSelect.appendChild(opt);
        });
    }

    const yearSelect = document.getElementById("yearSelect");
    for (let y = 2026; y >= 2006; y--) {
        let opt = document.createElement("option");
        opt.value = y;
        opt.textContent = y;
        if (y === 2011) opt.selected = true;
        yearSelect.appendChild(opt);
    }

    updateModels();

    async function fetchMarket() {
        const make = document.getElementById("makeSelect").value;
        const model = document.getElementById("modelSelect").value;
        const year = document.getElementById("yearSelect").value;
        const statusEl = document.getElementById("status");
        const container = document.getElementById("listingsContainer");

        statusEl.textContent = `Scanning live market for ${year} ${make} ${model}...`;
        container.innerHTML = "";

        try {
            const response = await fetch('https://www.donedeal.ie/search/api/v4/find/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    section: "cars",
                    adType: "forsale",
                    sort: "relevance desc",
                    max: 25,
                    words: `${make} ${model} ${year}`
                })
            });

            if (!response.ok) throw new Error("Network response failed");

            const data = await response.json();
            const ads = data.ads || [];

            let prices = [];
            let htmlContent = "";

            ads.forEach(ad => {
                let price = parseFloat((ad.price || "0").toString().replace(/[^0-9.]/g, ''));
                if (price >= 400) prices.push(price);

                let title = ad.header || `${make} ${model}`;
                let county = ad.county || "Ireland";
                let adId = ad.id || "";
                let url = ad.friendlyUrl ? (ad.friendlyUrl.startsWith("http") ? ad.friendlyUrl : `https://www.donedeal.ie${ad.friendlyUrl}`) : `https://www.donedeal.ie/cars-for-sale/view/${adId}`;

                htmlContent += `
                    <div class="listing-item">
                        <div class="listing-info">
                            <div class="listing-title">${title}</div>
                            <div class="listing-meta">${county}</div>
                            <a href="${url}" target="_blank" class="btn-view">View Ad ↗</a>
                        </div>
                        <div class="listing-price">€${price.toLocaleString()}</div>
                    </div>
                `;
            });

            if (prices.length > 0) {
                prices.sort((a,b) => a - b);
                let low = prices[Math.floor(prices.length * 0.15)];
                let avg = prices[Math.floor(prices.length * 0.50)];
                let high = prices[Math.floor(prices.length * 0.85)];

                document.getElementById("valHigh").textContent = `€${Math.round(high).toLocaleString()}`;
                document.getElementById("valAvg").textContent = `€${Math.round(avg).toLocaleString()}`;
                document.getElementById("valLow").textContent = `€${Math.round(low).toLocaleString()}`;
                statusEl.textContent = `Found ${prices.length} active listings.`;
                container.innerHTML = htmlContent;
            } else {
                statusEl.textContent = "No comparable listings found for this selection.";
            }

        } catch (err) {
            statusEl.textContent = "Live lookup blocked by browser security (CORS). Use desktop app for direct scans.";
        }
    }
</script>
</body>
</html>
