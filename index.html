<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PJ Market Valuation & Salvage Guide</title>
    <meta name="theme-color" content="#0F172A">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0;
            padding: 14px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #F1F5F9;
            color: #0F172A;
        }
        .header {
            background-color: #0F172A;
            color: #FFFFFF;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .header h1 { margin: 0; font-size: 16px; font-weight: 700; letter-spacing: 0.5px; }
        .header span { font-size: 11px; color: #38BDF8; font-weight: bold; }
        
        .nav-tabs {
            display: flex;
            background: #1E293B;
            border-radius: 8px;
            padding: 4px;
            margin-bottom: 14px;
        }
        .nav-tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            color: #94A3B8;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            border-radius: 6px;
            border: none;
            background: transparent;
        }
        .nav-tab.active {
            background: #FFFFFF;
            color: #0F172A;
        }

        .card {
            background: #FFFFFF;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 14px;
            box-shadow: 0 2px 6px rgba(15, 23, 42, 0.08);
        }
        
        .field-group { margin-bottom: 12px; }
        .field-group label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: #475569;
            margin-bottom: 5px;
            text-transform: uppercase;
        }
        .row-group { display: flex; gap: 10px; }
        .row-group .field-group { flex: 1; }

        select {
            width: 100%;
            height: 44px;
            border: 1px solid #CBD5E1;
            border-radius: 8px;
            background: #FFFFFF;
            padding: 0 12px;
            font-size: 15px;
            color: #0F172A;
            font-weight: 600;
            outline: none;
        }
        select:focus { border-color: #0284C7; }

        .btn-row { display: flex; gap: 8px; margin-top: 14px; }
        button {
            flex: 1;
            height: 48px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-primary { background: #0284C7; color: white; }
        .btn-primary:active { background: #0369A1; }
        .btn-sec { background: #E2E8F0; color: #334155; flex: 0.4; }
        .btn-sec:active { background: #CBD5E1; }

        .kpi-container { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
        .kpi {
            border-radius: 10px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .kpi-title { font-size: 12px; font-weight: 700; }
        .kpi-sub { font-size: 10px; opacity: 0.8; }
        .kpi-val { font-size: 22px; font-weight: 800; }

        .kpi-purple { background: #FAF5FF; border: 1px solid #E9D5FF; color: #6B21A8; }
        .kpi-green { background: #F0FDF4; border: 1px solid #BBF7D0; color: #166534; }
        .kpi-blue { background: #EFF6FF; border: 1px solid #BFDBFE; color: #1E40AF; }
        .kpi-yellow { background: #FEFCE8; border: 1px solid #FEF08A; color: #854D0E; }

        .status-bar {
            font-size: 12px;
            color: #475569;
            margin-bottom: 12px;
            padding: 10px 12px;
            background: #FFFFFF;
            border-radius: 8px;
            border: 1px solid #E2E8F0;
            line-height: 1.5;
        }

        .listing-card {
            background: #FFFFFF;
            border-radius: 10px;
            padding: 12px 14px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 1px 3px rgba(15,23,42,0.06);
            border: 1px solid #E2E8F0;
        }
        .listing-info { flex: 1; padding-right: 10px; }
        .listing-title { font-size: 13px; font-weight: 700; color: #0F172A; margin-bottom: 4px; }
        .listing-meta { font-size: 11px; color: #64748B; display: flex; gap: 8px; align-items: center; }
        
        .listing-repaired-col {
            text-align: center; 
            padding: 0 10px; 
            border-left: 1px solid #F1F5F9; 
            border-right: 1px solid #F1F5F9; 
            margin-right: 10px;
        }
        .listing-repaired-lbl { font-size: 9px; color: #64748B; font-weight: 700; text-transform: uppercase; }
        .listing-repaired-val { font-size: 13px; font-weight: 800; color: #6B21A8; }

        .year-badge { background: #0284C7; color: white; padding: 2px 6px; border-radius: 4px; font-weight: 700; font-size: 10px; }
        .listing-price-col { text-align: right; }
        .listing-price { font-size: 15px; font-weight: 800; color: #0284C7; margin-bottom: 4px; }
        .btn-view {
            background: #0F172A;
            color: white;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            text-decoration: none;
            display: inline-block;
        }
        .btn-view:active { background: #334155; }
    </style>
</head>
<body>

    <div class="header">
        <h1>PJ MARKET VALUATION</h1>
        <span id="modeTitle">Standard Valuation</span>
    </div>

    <div class="nav-tabs">
        <button class="nav-tab active" id="tabStandard" onclick="switchMode('cars')">Standard Valuation</button>
        <button class="nav-tab" id="tabSalvage" onclick="switchMode('damagedcars')">Damaged / Salvage</button>
    </div>

    <div class="card">
        <div class="field-group">
            <label>Make</label>
            <select id="makeSelect" onchange="updateModels()">
                <option value="Nissan">Nissan</option>
                <option value="Ford">Ford</option>
                <option value="Volkswagen">Volkswagen</option>
                <option value="Peugeot">Peugeot</option>
            </select>
        </div>

        <div class="field-group">
            <label>Model</label>
            <select id="modelSelect"></select>
        </div>

        <div class="row-group">
            <div class="field-group">
                <label>Year From</label>
                <select id="yearFromSelect"></select>
            </div>
            <div class="field-group">
                <label>Year To</label>
                <select id="yearToSelect"></select>
            </div>
        </div>

        <div class="btn-row">
            <button class="btn-primary" onclick="lookupVehicle(false)">🔍 Check Market</button>
            <button class="btn-sec" onclick="lookupVehicle(true)" title="Force fresh scrape">⚡ Live</button>
        </div>
    </div>

    <div class="kpi-container">
        <!-- New KPI that only shows in Damaged Mode -->
        <div class="kpi kpi-purple" id="kpiRepaired" style="display: none;">
            <div>
                <div class="kpi-title">EST. REPAIRED VALUE</div>
                <div class="kpi-sub">Standard Market Average</div>
            </div>
            <div class="kpi-val" id="statRepaired">€0</div>
        </div>

        <div class="kpi kpi-green">
            <div>
                <div class="kpi-title" id="lblHigh">DEALER / RETAIL (MINT)</div>
                <div class="kpi-sub" id="subHigh">Clean NCT / Forecourt Guide</div>
            </div>
            <div class="kpi-val" id="statHigh">€0</div>
        </div>

        <div class="kpi kpi-blue">
            <div>
                <div class="kpi-title" id="lblAvg">MARKET AVERAGE</div>
                <div class="kpi-sub" id="subAvg">Typical Asking Price</div>
            </div>
            <div class="kpi-val" id="statAvg">€0</div>
        </div>

        <div class="kpi kpi-yellow">
            <div>
                <div class="kpi-title" id="lblLow">TRADE / BUY TARGET</div>
                <div class="kpi-sub" id="subLow">Short NCT / Prep Project</div>
            </div>
            <div class="kpi-val" id="statLow">€0</div>
        </div>
    </div>

    <div class="status-bar" id="statusBar">Ready. Select vehicle and tap Check Market.</div>

    <div id="listingsList"></div>

    <script>
        let currentSection = 'cars';

        const models = {
            'Nissan': ['Qashqai', 'Juke', 'Micra', 'X-Trail', 'Note'],
            'Ford': ['Focus', 'Fiesta', 'Mondeo', 'Kuga', 'Transit Connect'],
            'Volkswagen': ['Golf', 'Passat', 'Polo', 'Tiguan', 'Caddy'],
            'Peugeot': ['208', '308', '2008', '3008', '5008', '508']
        };

        function initDropdowns() {
            const yearFromSel = document.getElementById('yearFromSelect');
            const yearToSel = document.getElementById('yearToSelect');
            const currentYear = new Date().getFullYear();
            
            for (let y = currentYear; y >= 2006; y--) {
                const opt1 = document.createElement('option');
                opt1.value = y; opt1.text = y;
                if (y === 2018) opt1.selected = true;
                yearFromSel.appendChild(opt1);

                const opt2 = document.createElement('option');
                opt2.value = y; opt2.text = y;
                if (y === 2018) opt2.selected = true;
                yearToSel.appendChild(opt2);
            }
            updateModels();
        }

        function updateModels() {
            const make = document.getElementById('makeSelect').value;
            const modelSel = document.getElementById('modelSelect');
            modelSel.innerHTML = '';
            models[make].forEach(m => {
                const opt = document.createElement('option');
                opt.value = m;
                opt.text = m;
                modelSel.appendChild(opt);
            });
        }

        function switchMode(section) {
            currentSection = section;
            document.getElementById('tabStandard').className = section === 'cars' ? 'nav-tab active' : 'nav-tab';
            document.getElementById('tabSalvage').className = section === 'damagedcars' ? 'nav-tab active' : 'nav-tab';
            document.getElementById('modeTitle').innerText = section === 'cars' ? 'Standard Valuation' : 'Damaged / Salvage';

            document.getElementById('kpiRepaired').style.display = section === 'damagedcars' ? 'flex' : 'none';

            if (section === 'damagedcars') {
                document.getElementById('lblHigh').innerText = 'HIGHEST SALVAGE ASKING';
                document.getElementById('subHigh').innerText = 'Minor Damage / High Spec';
                document.getElementById('lblAvg').innerText = 'AVERAGE REPAIRABLE ASKING';
                document.getElementById('subAvg').innerText = 'Median Salvage Price';
                document.getElementById('lblLow').innerText = 'LOWEST SALVAGE BUY-IN';
                document.getElementById('subLow').innerText = 'Bottom 15th %ile Target';
            } else {
                document.getElementById('lblHigh').innerText = 'DEALER / RETAIL (MINT)';
                document.getElementById('subHigh').innerText = 'Clean NCT / Forecourt Guide';
                document.getElementById('lblAvg').innerText = 'MARKET AVERAGE';
                document.getElementById('subAvg').innerText = 'Typical Asking Price';
                document.getElementById('lblLow').innerText = 'TRADE / BUY TARGET';
                document.getElementById('subLow').innerText = 'Short NCT / Prep Project';
            }
            document.getElementById('statusBar').innerText = `Switched to ${section === 'cars' ? 'Standard Valuation' : 'Damaged / Salvage'}. Ready.`;
            document.getElementById('listingsList').innerHTML = '';
        }

        function getPercentile(arr, p) {
            if (arr.length === 0) return 0;
            const idx = Math.min(Math.floor((p / 100) * arr.length), arr.length - 1);
            return arr[idx];
        }

        async function lookupVehicle(forceFresh) {
            const make = document.getElementById('makeSelect').value;
            const model = document.getElementById('modelSelect').value;
            const yearFrom = document.getElementById('yearFromSelect').value;
            const yearTo = document.getElementById('yearToSelect').value;
            const cacheKey = `${currentSection}_${make}_${model}_${yearFrom}_${yearTo}`.toLowerCase();
            const status = document.getElementById('statusBar');

            if (!forceFresh) {
                const cached = localStorage.getItem(cacheKey);
                if (cached) {
                    try {
                        const data = JSON.parse(cached);
                        const daysOld = Math.floor((new Date() - new Date(data.date)) / (1000 * 60 * 60 * 24));
                        if (daysOld < 30) {
                            renderResults(data.high, data.avg, data.low, data.listings, data.stdAvg || 0);
                            status.innerText = `Loaded from Cache (${daysOld}d old)`;
                            return;
                        }
                    } catch (e) {}
                }
            }

            status.innerText = `Querying live DoneDeal ${currentSection === 'damagedcars' ? 'Salvage & Standard Baseline' : 'Standard'} market...`;

            const primaryUrl = `https://pj-val-proxy.pauljordanie.workers.dev/?section=${currentSection}&make=${encodeURIComponent(make)}&model=${encodeURIComponent(model)}&year_from=${yearFrom}&year_to=${yearTo}`;
            
            // Prepare concurrent requests
            const fetchPromises = [ fetch(primaryUrl).then(r => r.ok ? r.json() : null).catch(()=>null) ];
            let stdIndex = -1;
            let stdAvg = 0;

            // If in salvage mode, fetch the standard cars concurrently to establish the repaired baseline
            if (currentSection === 'damagedcars') {
                const stdCacheKey = `cars_${make}_${model}_${yearFrom}_${yearTo}`.toLowerCase();
                let needFetch = true;
                if (!forceFresh) {
                    const cachedStd = localStorage.getItem(stdCacheKey);
                    if (cachedStd) {
                        try {
                            stdAvg = JSON.parse(cachedStd).avg;
                            needFetch = false;
                        } catch(e) {}
                    }
                }
                
                if (needFetch) {
                    const stdUrl = `https://pj-val-proxy.pauljordanie.workers.dev/?section=cars&make=${encodeURIComponent(make)}&model=${encodeURIComponent(model)}&year_from=${yearFrom}&year_to=${yearTo}`;
                    stdIndex = fetchPromises.length;
                    fetchPromises.push(fetch(stdUrl).then(r => r.ok ? r.json() : null).catch(()=>null));
                }
            }

            const results = await Promise.all(fetchPromises);
            const data = results[0];

            // Parse standard market average if we fetched it
            if (stdIndex !== -1 && results[stdIndex] && results[stdIndex].ads) {
                let stdPrices = [];
                results[stdIndex].ads.forEach(ad => {
                    let p = parseFloat((ad.price||"").replace(/[^0-9.]/g, ''))||0;
                    if (p >= 400) stdPrices.push(p);
                });
                if (stdPrices.length > 0) {
                    stdPrices.sort((a,b) => a - b);
                    stdAvg = getPercentile(stdPrices, 50);
                }
            }

            if (!data || !data.ads || data.ads.length === 0) {
                status.innerText = `No listings returned via worker bridge.`;
                return;
            }

            let listings = [];
            let prices = [];
            const minP = currentSection === 'damagedcars' ? 150 : 400;

            data.ads.forEach(ad => {
                let priceNum = 0;
                if (ad.price) {
                    priceNum = parseFloat(ad.price.replace(/[^0-9.]/g, '')) || 0;
                }

                if (priceNum >= minP) {
                    let adUrl = '';
                    if (ad.friendlyUrl && ad.friendlyUrl.length > 0) {
                        adUrl = ad.friendlyUrl.startsWith('http') ? ad.friendlyUrl : `https://www.donedeal.ie${ad.friendlyUrl}`;
                    } else if (ad.id) {
                        adUrl = `https://www.donedeal.ie/${currentSection}-for-sale/view/${ad.id}`;
                    }

                    // For standard cars, pull the year from the payload (Worker injects ad.year for Salvage)
                    let adYear = yearFrom;
                    if (ad.year) {
                        adYear = ad.year;
                    } else {
                        const titleText = ad.header || "";
                        const yearMatch = titleText.match(/\b(20[0-2][0-9])\b/);
                        if (yearMatch) adYear = yearMatch[1];
                    }

                    listings.push({
                        title: ad.header || `${make} ${model}`,
                        year: adYear,
                        price: priceNum,
                        location: ad.county || 'Ireland',
                        url: adUrl
                    });
                    prices.push(priceNum);
                }
            });

            if (prices.length === 0) {
                status.innerText = 'No realistic asking prices found.';
                return;
            }

            prices.sort((a, b) => a - b);
            const low = getPercentile(prices, 15);
            const avg = getPercentile(prices, 50);
            const high = getPercentile(prices, 85);

            localStorage.setItem(cacheKey, JSON.stringify({
                date: new Date().toISOString().split('T')[0],
                high: high,
                avg: avg,
                low: low,
                stdAvg: stdAvg,
                listings: listings
            }));

            renderResults(high, avg, low, listings, stdAvg);
            status.innerText = `Market guide updated (${prices.length} vehicles found).`;
        }

        function renderResults(high, avg, low, items, stdAvg = 0) {
            document.getElementById('statHigh').innerText = '€' + Math.round(high).toLocaleString();
            document.getElementById('statAvg').innerText = '€' + Math.round(avg).toLocaleString();
            document.getElementById('statLow').innerText = '€' + Math.round(low).toLocaleString();
            
            if (currentSection === 'damagedcars') {
                document.getElementById('statRepaired').innerText = stdAvg > 0 ? '€' + Math.round(stdAvg).toLocaleString() : 'N/A';
            }

            const container = document.getElementById('listingsList');
            container.innerHTML = '';

            items.sort((a, b) => b.price - a.price);

            items.forEach(item => {
                const div = document.createElement('div');
                div.className = 'listing-card';
                
                let midColumn = '';
                if (currentSection === 'damagedcars' && stdAvg > 0) {
                    midColumn = `
                        <div class="listing-repaired-col">
                            <div class="listing-repaired-lbl">Repaired Avg</div>
                            <div class="listing-repaired-val">€${Math.round(stdAvg).toLocaleString()}</div>
                        </div>
                    `;
                }

                div.innerHTML = `
                    <div class="listing-info">
                        <div class="listing-title">${item.title}</div>
                        <div class="listing-meta">
                            <span class="year-badge">${item.year}</span>
                            <span>📍 ${item.location}</span>
                        </div>
                    </div>
                    ${midColumn}
                    <div class="listing-price-col">
                        <div class="listing-price">€${Math.round(item.price).toLocaleString()}</div>
                        ${item.url ? `<a href="${item.url}" target="_blank" class="btn-view">View Ad ↗</a>` : ''}
                    </div>
                `;
                container.appendChild(div);
            });
        }

        initDropdowns();
    </script>
</body>
</html>
